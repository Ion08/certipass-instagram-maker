[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "certipass-instagram-maker"
version = "0.1.0"
description = "Subscription-backed, Meta-API-based daily Instagram Reel workflow for certiPass.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.4,<13",
  "requests>=2.32,<3",
  "pypdf>=5.4,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
certipass-instagram = "certipass_instagram.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
