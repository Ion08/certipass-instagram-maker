name: Daily certiPass Instagram image draft

on:
  schedule:
    - cron: "23 7 * * *"
      timezone: "Europe/Chisinau"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: certipass-daily-content
  cancel-in-progress: false

jobs:
  create-draft:
    if: ${{ github.ref == 'refs/heads/main' && vars.ENABLE_DAILY_DRAFTS == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PNG renderer and Codex CLI
        run: |
          python -m pip install -e '.[dev]'
          npm install --global @openai/codex@0.156.1

      - name: Run local safety tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Restore content history
        uses: actions/cache/restore@v4
        with:
          path: data/ledger.json
          key: certipass-content-ledger-${{ github.run_id }}
          restore-keys: |
            certipass-content-ledger-

      - name: Prepare ChatGPT subscription login
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CODEX_AUTH_JSON:-}" ]]; then
            echo "Add CODEX_AUTH_JSON in repository Actions secrets before enabling this workflow."
            exit 1
          fi
          mkdir -p "$HOME/.codex"
          chmod 700 "$HOME/.codex"
          printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
          chmod 600 "$HOME/.codex/auth.json"
          jq -e '.auth_mode == "chatgpt" and (.tokens.refresh_token | type == "string" and length > 0)' \
            "$HOME/.codex/auth.json" >/dev/null
          printf 'cli_auth_credentials_store = "file"\n' > "$HOME/.codex/config.toml"

      - name: Generate one daily Instagram image post
        env:
          PYTHONPATH: src
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m certipass_instagram.cli draft

      - name: Save refreshed ChatGPT subscription login
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CODEX_SECRET_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s "$HOME/.codex/auth.json" ]]; then
            echo "Codex auth file is unavailable; the refreshed subscription login was not saved."
            exit 1
          fi
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Add a fine-grained, single-repository token with Actions secrets write access as CODEX_SECRET_WRITE_TOKEN."
            exit 1
          fi
          jq -e '.auth_mode == "chatgpt" and (.tokens.refresh_token | type == "string" and length > 0)' \
            "$HOME/.codex/auth.json" >/dev/null
          gh secret set CODEX_AUTH_JSON < "$HOME/.codex/auth.json"

      - name: Save content history
        if: always() && hashFiles('data/ledger.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/ledger.json
          key: certipass-content-ledger-${{ github.run_id }}

      - name: Upload private draft files for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certipass-daily-post-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
