name: Post today / Daily 18:00

on:
  schedule:
    # UTC schedules: 18:00 / 18:20 in Chisinau, including daylight saving time.
    # The schedule gate skips the other season's UTC hour.
    - cron: '0,20 15 * * *'
    - cron: '0,20 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: certipass-instagram-publishing
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Chisinau publishing time
        id: schedule
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          def schedule_allows_publish(event_name, event_cron, now):
              if event_name == "workflow_dispatch":
                  return True
              if event_name != "schedule" or now.hour < 18:
                  return False
              target_utc = now.replace(hour=18, minute=0, second=0, microsecond=0).astimezone(timezone.utc)
              expected_cron = f"0,20 {target_utc.hour} * * *"
              return event_cron == expected_cron

          now = datetime.now(ZoneInfo("Europe/Chisinau"))
          event = os.environ["TRIGGER_EVENT"]
          cron = os.environ.get("TRIGGER_CRON", "")
          allowed = schedule_allows_publish(event, cron, now)
          detail = (
              f"Trigger: {event}; cron: {cron or 'manual'}; "
              f"Chisinau time: {now.isoformat()}; publish allowed: {allowed}. "
              "The publisher separately checks whether today is already posted."
          )
          print(detail)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"publish={str(allowed).lower()}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(detail + "\n\n")
          PY
      - name: Install token encryption
        if: steps.schedule.outputs.publish == 'true'
        run: python -m pip install 'cryptography>=44,<48'
      - name: Publish the next carousel
        if: steps.schedule.outputs.publish == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          META_GRAPH_VERSION: v26.0
        run: python publish.py
      - name: Save publishing history
        if: always() && steps.schedule.outputs.publish == 'true'
        run: |
          git add -A data/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record Instagram carousel'
          git push origin HEAD:main
